name: Deploy to GitHub Pages

# Builds the playground and publishes it to GitHub Pages on every push to
# main. The app is a static Angular SPA served under the project subpath
# (https://mosaicoo.github.io/svgengine-playground/), so the build uses
# `--base-href /svgengine-playground/` and a 404.html fallback (copy of
# index.html) so deep links and the `?embed=1` iframe survive a refresh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/svgengine-playground/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
